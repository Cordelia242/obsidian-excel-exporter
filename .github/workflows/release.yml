name: Release Obsidian plugin

# Pushing a tag equal to the manifest version (e.g. 1.0.0) builds the plugin and
# publishes a GitHub release with main.js, manifest.json and styles.css.
# Release notes come from release-notes/<version>.md (or are generated from commits).
# It can also be started from the Actions tab ("Run workflow"): the tag is then
# taken from manifest.json and created by the release.
on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Test and build plugin
        run: |
          npm ci
          npm test
          npm run build

      - name: Resolve release tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            if [ "$tag" != "$version" ]; then
              echo "Tag $tag does not match manifest.json version $version"
              exit 1
            fi
          else
            tag="$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists: bump the version in manifest.json first"
              exit 1
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      # Attestations are only available for public repositories (or GitHub Enterprise).
      - name: Generate artifact attestation
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$TAG"
          if [ -f "release-notes/$tag.md" ]; then
            notes=(--notes-file "release-notes/$tag.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title="$tag" \
            "${notes[@]}" \
            main.js manifest.json styles.css
