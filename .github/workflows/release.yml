name: Release Obsidian plugin

# Pushing a tag equal to the manifest version (e.g. 1.0.0) builds the plugin and
# publishes a GitHub release with main.js, manifest.json and styles.css.
# Release notes come from release-notes/<version>.md (or are generated from commits).
on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Test and build plugin
        run: |
          npm ci
          npm test
          npm run build

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version"
            exit 1
          fi

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ -f "release-notes/$tag.md" ]; then
            notes=(--notes-file "release-notes/$tag.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "$tag" \
            --title="$tag" \
            "${notes[@]}" \
            main.js manifest.json styles.css
